# Pubblica su itch.io le versioni "mobile" e "pc" del ramo claude/battaglia-v2.
#   - Nuove versioni: releases/ODISPEL mobile v.X.Y.Z.apk  e  releases/ODISPEL pc vX.Y.Z.zip
#     canali android-mobile (APK) e windows-pc (zip).
#   - Con "[itch-rename]" nel messaggio del commit si ricaricano anche le serie precedenti, con i file rinominati:
#     "(DEPRECATO) ODISPEL test mobile/pc v0.26.10" (canali android-v2test e windows-v2b)
#     "(DEPRECATO) ODISPEL old mobile/pc v0.26.2" (canali android e windows).
# I nomi dei canali su itch non si possono cambiare da butler: cambia il nome dei file caricati.
name: Pubblica TEST V2 su itch.io

on:
  push:
    branches: [claude/battaglia-v2]
    paths:
      - 'releases/ODISPEL mobile v.*.apk'
      - 'releases/ODISPEL pc v*.zip'
      - '.github/workflows/itch_v2test.yml'

jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_TARGET: boomeranza/odispel
    steps:
      - uses: actions/checkout@v4
      - name: Controlla che la chiave ci sia
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "Manca il segreto ITCH_API_KEY: niente da caricare."; exit 1; fi
      - name: Installa butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Carica mobile e pc
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          push() {   # file canale versione
            for n in 1 2 3 4 5 6 7 8; do
              if ./butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$3" > out.txt 2>&1; then cat out.txt; return 0; fi
              cat out.txt; sleep 45
            done
            echo "::error::butler push $2 fallito: $(tail -c 400 out.txt | tr '\n' ' ')"
            return 1
          }
          apk=$(ls releases/ODISPEL\ mobile\ v.*.apk | sort -V | tail -1)
          zip=$(ls releases/ODISPEL\ pc\ v*.zip | sort -V | tail -1)
          ver=$(basename "$apk" .apk | sed 's/ODISPEL mobile v\.//')
          push "$apk" android-mobile "$ver"
          push "$zip" windows-pc "$ver"
          if echo "$MSG" | grep -q '\[itch-rename\]'; then
            # versioni precedenti (altri canali): file rinominati "(DEPRECATO) nome vX" per non confondere chi scarica
            mkdir -p ren
            cp releases/ODISPEL-0.26.10-v2test.apk "ren/(DEPRECATO) ODISPEL test mobile v0.26.10.apk"
            cp releases/ODISPEL-0.26.10-v2test-windows.zip "ren/(DEPRECATO) ODISPEL test pc v0.26.10.zip"
            cp releases/ODISPEL-0.26.2.apk "ren/(DEPRECATO) ODISPEL old mobile v0.26.2.apk"
            cp releases/ODISPEL-0.26.2-windows.zip "ren/(DEPRECATO) ODISPEL old pc v0.26.2.zip"
            push "ren/(DEPRECATO) ODISPEL test mobile v0.26.10.apk" android-v2test 0.26.10-DEPRECATO
            push "ren/(DEPRECATO) ODISPEL test pc v0.26.10.zip" windows-v2b 0.26.10-DEPRECATO
            push "ren/(DEPRECATO) ODISPEL old mobile v0.26.2.apk" android 0.26.2-DEPRECATO
            push "ren/(DEPRECATO) ODISPEL old pc v0.26.2.zip" windows 0.26.2-DEPRECATO
          fi
