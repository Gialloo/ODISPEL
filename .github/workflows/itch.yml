# Pubblica su itch.io la V3 (pagina boomeranza/odispel-v3, separata dalla V2).
#   releases/ODISPEL V3 mobile v.X.Y.Z.apk -> canale android
#   releases/ODISPEL V3 pc vX.Y.Z.zip      -> canale windows
# Prima di caricare controlla la firma dell'APK con apksigner del runner (l'APK e' firmato da tools/sign_apk.py).
name: Pubblica V3 su itch.io

on:
  push:
    branches: [main]
    paths:
      - 'releases/ODISPEL V3 mobile v.*.apk'
      - 'releases/ODISPEL V3 pc v*.zip'
      - '.github/workflows/itch.yml'
  workflow_dispatch:

jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_TARGET: boomeranza/odispel-v3
    steps:
      - uses: actions/checkout@v4
      - name: Controlla la firma dell'APK
        run: |
          apk=$(ls releases/ODISPEL\ V3\ mobile\ v.*.apk | sort -V | tail -1)
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --verbose --min-sdk-version 24 "$apk"
      - name: Controlla che la chiave ci sia
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Manca il segreto ITCH_API_KEY"; exit 1; fi
      - name: Installa butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Carica mobile e pc
        run: |
          push() {   # file canale versione
            for n in 1 2 3 4 5 6; do
              if ./butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$3" > out.txt 2>&1; then cat out.txt; return 0; fi
              cat out.txt; sleep 45
            done
            echo "::error::butler push $2 fallito: $(tail -c 400 out.txt | tr '\n' ' ')"
            return 1
          }
          apk=$(ls releases/ODISPEL\ V3\ mobile\ v.*.apk | sort -V | tail -1)
          zip=$(ls releases/ODISPEL\ V3\ pc\ v*.zip | sort -V | tail -1)
          ver=$(basename "$apk" .apk | sed 's/ODISPEL V3 mobile v\.//')
          push "$apk" android "$ver"
          push "$zip" windows "$ver"
