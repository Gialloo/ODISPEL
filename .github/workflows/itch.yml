# Pubblica su itch.io la V3 "OFFICIAL DEMO ODISPEL" sulla stessa pagina della V2 (boomeranza/odispel), su canali propri.
#   releases/OFFICIAL DEMO ODISPEL mobile v.X.Y.Z.apk -> canale android-v3
#   releases/OFFICIAL DEMO ODISPEL pc vX.Y.Z.zip      -> canale windows-v3
# I canali della V2 (android-mobile, windows-pc) non si toccano.
# Prima di caricare controlla la firma dell'APK con apksigner del runner (l'APK e' firmato da tools/sign_apk.py).
name: Pubblica V3 su itch.io

on:
  push:
    branches: [claude/v3-prologo]
    paths:
      - 'releases/OFFICIAL DEMO ODISPEL mobile v.*.apk'
      - 'releases/OFFICIAL DEMO ODISPEL pc v*.zip'
      - '.github/workflows/itch.yml'
  workflow_dispatch:

jobs:
  itch:
    # La pubblicazione e' consentita soltanto dal branch di release V3.
    # Evita che un dispatch manuale da branch sperimentali carichi pacchetti su itch.io.
    if: github.ref == 'refs/heads/claude/v3-prologo'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_TARGET: boomeranza/odispel
    steps:
      - uses: actions/checkout@v4
      - name: Verifica e abbina i pacchetti della stessa versione
        id: artifacts
        shell: bash
        run: |
          shopt -s nullglob
          apks=(releases/OFFICIAL\ DEMO\ ODISPEL\ mobile\ v.*.apk)
          zips=(releases/OFFICIAL\ DEMO\ ODISPEL\ pc\ v*.zip)
          if (( ${#apks[@]} == 0 || ${#zips[@]} == 0 )); then
            echo "::error::Manca l'APK o lo ZIP Windows nella cartella releases"
            exit 1
          fi
          apk=$(printf '%s\n' "${apks[@]}" | sort -V | tail -1)
          zip=$(printf '%s\n' "${zips[@]}" | sort -V | tail -1)
          apk_version=$(basename "$apk" .apk | sed 's/^OFFICIAL DEMO ODISPEL mobile v//')
          zip_version=$(basename "$zip" .zip | sed 's/^OFFICIAL DEMO ODISPEL pc v//')
          if [[ ! "$apk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$apk_version" != "$zip_version" ]]; then
            echo "::error::Versioni APK ($apk_version) e ZIP ($zip_version) assenti o non corrispondenti"
            exit 1
          fi
          if ! unzip -Z1 "$zip" | grep -Eq '\.exe$' || ! unzip -Z1 "$zip" | grep -Eq '\.pck$'; then
            echo "::error::Lo ZIP Windows deve contenere sia EXE sia PCK"
            exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$apk_version" >> "$GITHUB_OUTPUT"
          echo "Pacchetti selezionati: versione $apk_version"

      - name: Controlla la firma dell'APK
        env:
          APK_FILE: ${{ steps.artifacts.outputs.apk }}
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --verbose --min-sdk-version 24 "$APK_FILE"
      - name: Controlla che la chiave ci sia
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Manca il segreto ITCH_API_KEY"; exit 1; fi
      - name: Installa butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Carica mobile e pc
        run: |
          push() {   # file canale versione
            for n in 1 2 3 4 5 6; do
              if ./butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$3" > out.txt 2>&1; then cat out.txt; return 0; fi
              cat out.txt; sleep 45
            done
            echo "::error::butler push $2 fallito: $(tail -c 400 out.txt | tr '\n' ' ')"
            return 1
          }
          push "${{ steps.artifacts.outputs.apk }}" android-v3 "${{ steps.artifacts.outputs.version }}"
          push "${{ steps.artifacts.outputs.zip }}" windows-v3 "${{ steps.artifacts.outputs.version }}"
