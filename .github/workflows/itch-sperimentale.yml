# Pubblica su itch.io le build SPERIMENTALI, su canali separati: la versione stabile (android-v3, windows-v3) non si tocca.
#   releases_sperimentali/*.apk -> canale experimental-android
#   releases_sperimentali/*.zip -> canale experimental-pc
# Parte solo con un push su un branch experiment/** che cambia i file in releases_sperimentali/ (aggiungerli = pubblicare:
# serve il via dell'autore). La pagina di destinazione NON e' scritta qui: sta nella variabile del repository ITCH_LAB_TARGET
# (es. boomeranza/odispel-lab, pagina in bozza o ad accesso ristretto). Se la variabile manca il workflow si ferma senza caricare.
name: Pubblica build sperimentale su itch.io

on:
  push:
    branches: ['experiment/**']
    paths:
      - 'releases_sperimentali/*.apk'
      - 'releases_sperimentali/*.zip'

jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_LAB_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla destinazione e chiave
        run: |
          if [ -z "$ITCH_TARGET" ]; then echo "::error::Manca la variabile ITCH_LAB_TARGET: nessun caricamento"; exit 1; fi
          if [ "$ITCH_TARGET" = "boomeranza/odispel" ]; then echo "::error::ITCH_LAB_TARGET non puo' essere la pagina stabile"; exit 1; fi
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Manca il segreto ITCH_API_KEY"; exit 1; fi
      - name: Controlla la firma dell'APK
        run: |
          apk=$(ls releases_sperimentali/*.apk | sort -V | tail -1)
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --verbose --min-sdk-version 24 "$apk"
      - name: Installa butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Carica sui canali sperimentali
        run: |
          push() {   # file canale versione
            for n in 1 2 3 4; do
              if ./butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$3" > out.txt 2>&1; then cat out.txt; return 0; fi
              cat out.txt; sleep 45
            done
            echo "::error::butler push $2 fallito: $(tail -c 400 out.txt | tr '\n' ' ')"
            return 1
          }
          apk=$(ls releases_sperimentali/*.apk | sort -V | tail -1)
          zip=$(ls releases_sperimentali/*.zip | sort -V | tail -1)
          ver="$(grep -m1 'config/version=' project.godot | cut -d'"' -f2)-exp.${GITHUB_REF_NAME##*/}+${GITHUB_SHA::7}"
          push "$apk" experimental-android "$ver"
          push "$zip" experimental-pc "$ver"
